# Shirobell stack for one environment (see docs/operations/docker-deploy.md).
# The same file serves production (branch main) and staging (branch dev);
# each lives in its own folder with its own .env:
#   /opt/shirobell      STACK_NAME=shirobell      -> shirobell.my.id
#   /opt/shirobell-dev  STACK_NAME=shirobell-dev  -> dev.shirobell.my.id
# Images are built by GitHub Actions and pulled from GHCR; IMAGE_TAG is set by
# the deploy job (commit sha).
#
# - web joins the reverse proxy network (PROXY_NETWORK); the proxy forwards
#   the environment's domains to http://${STACK_NAME}-web:80.
# - app, worker and scheduler join the MySQL network (DB_NETWORK).
#   If MySQL runs on the host instead, set DB_HOST=host.docker.internal.
# - Memory caps keep this stack from starving other services on a shared VPS;
#   override them in .env (APP_MEM, WORKER_MEM, SCHEDULER_MEM, WEB_MEM).

name: ${STACK_NAME:-shirobell}

x-app: &app
  image: ghcr.io/${GHCR_OWNER:-yobel47}/shirobell-app:${IMAGE_TAG:-latest}
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - internal
    - database

services:
  app:
    <<: *app
    container_name: ${STACK_NAME:-shirobell}-app
    mem_limit: ${APP_MEM:-320m}
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    container_name: ${STACK_NAME:-shirobell}-worker
    mem_limit: ${WORKER_MEM:-192m}
    command: ["php", "artisan", "queue:work", "--queue=default", "--sleep=3", "--tries=3", "--max-time=3600", "--memory=128"]

  scheduler:
    <<: *app
    container_name: ${STACK_NAME:-shirobell}-scheduler
    mem_limit: ${SCHEDULER_MEM:-128m}
    command: ["php", "artisan", "schedule:work"]

  web:
    image: ghcr.io/${GHCR_OWNER:-yobel47}/shirobell-web:${IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-shirobell}-web
    mem_limit: ${WEB_MEM:-48m}
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - storage:/var/www/html/storage:ro
    # Nginx reaches PHP-FPM as "app" over this stack's internal network only;
    # the shared proxy network never sees the app containers.
    networks:
      - internal
      - proxy

volumes:
  storage:
    name: ${STACK_NAME:-shirobell}-storage

networks:
  internal:
    name: ${STACK_NAME:-shirobell}-internal
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
  database:
    name: ${DB_NETWORK:-mysql}
    external: true
