# Every push to dev and main: tests and a Docker build check.
# Only main pushes images to GHCR and deploys to the VPS.
# Secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, DEPLOY_PATH, optional VPS_PORT
# See docs/operations/docker-deploy.md.
name: CI & Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_APP: ghcr.io/${{ github.repository_owner }}/shirobell-app
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/shirobell-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, zip, pdo_sqlite, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_APP }}:${{ github.sha }},${{ env.IMAGE_APP }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_WEB }}:${{ github.sha }},${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull images, migrate and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USER,DEPLOY_PATH
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            compose="docker compose -f docker-compose.prod.yml"
            $compose pull
            $compose run --rm --no-deps app php artisan migrate --force
            $compose run --rm --no-deps app php artisan db:seed --class=ThemeSeeder --force
            $compose up -d --remove-orphans
            $compose exec -T app php artisan queue:restart
            docker logout ghcr.io
            docker image prune -f
