; PHP-FPM pool overrides for Shirobell.
; Tuned for a small shared VPS: workers start on demand and exit when idle,
; so an idle stack uses very little memory.
[www]
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 20s
pm.max_requests = 300
; Health check endpoint for the container (cgi-fcgi).
ping.path = /fpm-ping
clear_env = no
