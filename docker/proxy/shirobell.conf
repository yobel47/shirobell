# Reverse proxy (existing Nginx container) -> Shirobell PRODUCTION.
# Copy into the proxy's conf.d folder. The proxy container must be on the
# same Docker network as shirobell-web (PROXY_NETWORK).
# TLS: Cloudflare Origin Certificate for shirobell.my.id and *.shirobell.my.id
# (Cloudflare proxied, SSL mode Full (strict)).

# Real client IP from Cloudflare; falls back to the connecting address.
map $http_cf_connecting_ip $shirobell_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name shirobell.my.id *.shirobell.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name shirobell.my.id *.shirobell.my.id;

    ssl_certificate     /etc/nginx/certs/shirobell-origin.pem;
    ssl_certificate_key /etc/nginx/certs/shirobell-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25M;

    # Resolve the container at request time, so the proxy still starts when
    # the Shirobell stack is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $shirobell_upstream http://shirobell-web:80;

    location / {
        proxy_pass $shirobell_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $shirobell_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
    }
}
