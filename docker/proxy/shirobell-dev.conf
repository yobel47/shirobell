# Reverse proxy (existing Nginx container) -> Shirobell STAGING.
# dev.shirobell.my.id and invitation subdomains *.dev.shirobell.my.id.
# Cloudflare's free certificate does not cover two-level wildcards, so these
# DNS records are "DNS only" (grey cloud) and TLS uses a Let's Encrypt
# wildcard certificate (see docs/operations/docker-deploy.md, staging).
# Nginx picks the longest matching wildcard, so *.dev.shirobell.my.id wins
# over *.shirobell.my.id from the production file.

server {
    listen 80;
    server_name dev.shirobell.my.id *.dev.shirobell.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.shirobell.my.id *.dev.shirobell.my.id;

    ssl_certificate     /etc/letsencrypt/live/dev.shirobell.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.shirobell.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25M;

    # Staging must never be indexed by search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $shirobell_dev_upstream http://shirobell-dev-web:80;

    location / {
        proxy_pass $shirobell_dev_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # No Cloudflare in front of staging: the connecting address is the client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
    }
}
